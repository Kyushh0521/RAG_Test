# ------------------------------------------------Global Paths------------------------------------------------#
model2path:
  bge_m3: "/mnt/share/wwt/retriever_model/bge-m3"  # 检索模型的本地路径
  qwen2_5_7b_instruct: "/mnt/share/wwt/Qwen2.5-7B-Instruct"  # 生成模型的本地路径

model2pooling:
  bge_m3: "cls"  # 模型编码池化方式：cls 或 mean

# ------------------------------------------------Environment Settings------------------------------------------------#
data_dir: "dataset/"  # 数据目录
save_dir: "output/"  # 结果保存目录

gpu_id: "0"  # GPU 设备 ID
dataset_name: "prediction"  # 数据集子目录名称
split: [ "test" ]  # 数据拆分列表

seed: 2024  # 随机种子
save_intermediate_data: True  # 是否保存中间数据

# -------------------------------------------------Retrieval Settings------------------------------------------------#
retrieval_method: "bge_m3"  # 检索模型标识
index_path: "corpus/bge_m3_flat.index"  # 向量索引路径
corpus_path: "corpus/corpus.jsonl"  # 语料文件路径

retrieval_topk: 3  # 每次检索返回的 top-k 文档数
retrieval_batch_size: 64  # 检索批处理大小
retrieval_use_fp16: True  # 检索/编码阶段是否使用 fp16
retrieval_query_max_length: 512  # 检索查询最大长度

# -------------------------------------------------Generator Settings------------------------------------------------#
framework: "vllm"  # 推理框架
generator_model: "qwen2_5_7b_instruct"  # 生成模型标识或路径
generator_max_input_len: 4096  # 生成器允许的最大输入长度
generation_params:
  do_sample: False  # 是否采用采样策略
  max_tokens: 512  # 最大生成长度

vllm_kwargs:
  gpu_memory_utilization: 0.65  # vllm 目标 GPU 内存使用比例
  tensor_parallel_size: 1  # 张量并行大小
  dtype: "bfloat16"  # 模型数据类型

# -------------------------------------------------Evaluation Settings------------------------------------------------#
metrics: ['em']  # 评估指标列表
save_metric_score: True  # 是否保存评估分数